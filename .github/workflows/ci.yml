# Build line: GitHub-hosted runners check every PR and build the image.
# Deploy line: the self-hosted runner on dev-home-vm-flipstream-01 deploys main.
# Weekly rebuild: main again with the newest yt-dlp, tagged sha-<7>-rYYYYMMDD
# and deployed, because YouTube changes break old yt-dlp releases.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "23 11 * * 1" # Mondays 11:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .

  # Runs pytest inside the image (the Dockerfile's test stage), so the media
  # tests use the image's ffmpeg. That layer comes from the build cache; an
  # apt-get install here took 5 to 8 minutes a run (DEV-53).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same yt-dlp as the build job, so the two share cached layers.
      - id: vars
        run: echo "ytdlp=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -er .info.version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          build-args: |
            YTDLP_VERSION=${{ steps.vars.outputs.ytdlp }}
          # Read the image's cache and this job's own; write to its own scope
          # so it doesn't replace the image's cache entry.
          cache-from: |
            type=gha
            type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Same commit, new yt-dlp: a tag of its own keeps the previous
            # image for a rollback.
            echo "tag=sha-${GITHUB_SHA::7}-r$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # Newest yt-dlp on PyPI: as a build arg it busts the cached layer
          # whenever there is a new release.
          echo "ytdlp=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -er .info.version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kflipdev/flipstream
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            YTDLP_VERSION=${{ steps.vars.outputs.ytdlp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only main deploys: a push (a merged PR), the weekly rebuild or a manual
    # run on main. Never a PR or a fork. The runner has only the label
    # flipstream-deploy (no default self-hosted labels), so no other job lands on it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [flipstream-deploy]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - run: sudo /usr/local/sbin/flipstream-deploy "$GITHUB_SHA" "$TAG"
        env:
          TAG: ${{ needs.build.outputs.tag }}
