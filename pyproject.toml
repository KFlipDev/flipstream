[project]
name = "flipstream"
version = "1.0.0"
description = "Paste a YouTube DJ-mix URL, review the metadata, get a tagged MP3."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "pyjwt[crypto]>=2.15,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.34",
    "redis>=8.1,<9",
    "rq>=3.0,<4",
    # Unpinned on purpose: the image installs the newest release at build time,
    # and a weekly rebuild keeps it current (YouTube changes often).
    "yt-dlp[default]>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.40,<3",
    "httpx>=0.28,<1",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flipstream = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
